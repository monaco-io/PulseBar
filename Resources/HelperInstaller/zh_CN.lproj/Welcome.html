<h1>PulseBar 助手</h1>
<p>提供应用排行和硬件温度，安装到个人“应用程序”文件夹。</p>
<p>安装后，在 PulseBar 设置中打开助手并选择“启用助手”。</p>
<p>更新前，请先停用并退出已有助手。</p>
