<h1>PulseBar 助手</h1>
<p>为 PulseBar 提供应用占用排行，以及设备支持的硬件温度。</p>
<p>安装器会将助手放入你个人的“应用程序”文件夹，无需拖拽文件或管理员权限。监控数据始终保留在本机。</p>
<p>安装后回到 PulseBar 设置，点击“打开助手”，再选择“启用助手”。后台服务只会在你启用后启动。</p>
<p>如果正在更新已有助手，请先停用助手并关闭其窗口，再继续安装。</p>
</body></html>
