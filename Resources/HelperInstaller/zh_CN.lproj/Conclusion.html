<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;color:#222}h1{font-size:22px}p{line-height:1.6}</style></head><body>
<h1>助手已安装</h1>
<p>回到“PulseBar → 设置 → PulseBar 助手”，点击“打开助手”。</p>
<p>在助手窗口选择“启用助手”。如 macOS 要求允许后台项目，请按窗口提示打开系统设置。</p>
<p>也可以在个人文件夹中的“应用程序”目录打开“PulseBar Helper”。</p>
<p>以后卸载时，请先选择“停用助手”，再将助手移入废纸篓。</p>
</body></html>
