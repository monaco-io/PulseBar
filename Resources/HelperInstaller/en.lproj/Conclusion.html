<h1>Helper installed</h1>
<p>In PulseBar Settings, choose <b>Open Helper</b>, then <b>Enable Helper</b>.</p>
<p>You can also open <b>PulseBar Helper</b> from your home folder’s Applications folder.</p>
<p>If background approval is required, follow the helper’s link to System Settings.</p>
