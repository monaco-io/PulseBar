<h1>PulseBar Helper</h1>
<p>Provides app rankings and hardware temperatures. Installs in your home folder’s Applications folder.</p>
<p>After installation, open the helper from PulseBar Settings and choose <b>Enable Helper</b>.</p>
<p>Before updating, disable and quit the existing helper.</p>
