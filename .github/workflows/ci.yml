name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-store:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test store configuration
        run: PULSEBAR_DISTRIBUTION=app-store ./scripts/swift-local.sh test --build-system native --disable-xctest --jobs 4 --scratch-path .build/store-debug
      - name: Verify universal store and helper bundles
        run: ./scripts/build-store-distribution.sh --local
      - name: Verify helper installer
        run: ./scripts/package-helper-release.sh --local
