name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test
        run: ./scripts/swift-local.sh test --disable-xctest
      - name: Build universal app
        run: ./scripts/build-app.sh
      - name: Sample packaged app
        run: dist/PulseBar.app/Contents/MacOS/PulseBar --sample 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PulseBar-universal-preview
          path: dist/PulseBar.zip
          if-no-files-found: error
          retention-days: 14
